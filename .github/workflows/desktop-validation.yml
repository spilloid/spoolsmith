name: Desktop validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build desktop
        run: go build -o dist/spoolsmith-gui.exe ./cmd/spoolsmith-gui
      - name: Exercise desktop and capture screens
        env:
          SPOOLSMITH_CAPTURE_SITE_SHOTS: '1'
        run: dotnet test test/gui/SpoolSmithGui.Tests --logger 'trx;LogFileName=desktop.trx' --results-directory dist/gui-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation
          path: |
            dist/gui-results
            dist/*failure.png
            docs/img/*.png
