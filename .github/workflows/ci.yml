name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v
      - name: Build GUI exe for FlaUI tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -o dist/spoolsmith-gui.exe ./cmd/spoolsmith-gui
          Copy-Item cmd/spoolsmith-gui/spoolsmith-gui.exe.manifest dist/ -Force
      - uses: actions/setup-dotnet@v4
        if: matrix.os == 'windows-latest'
        with:
          dotnet-version: "8.0.x"
      - name: GUI tests (FlaUI)
        if: matrix.os == 'windows-latest'
        run: dotnet test test/gui/SpoolSmithGui.Tests
