name: Signing check

# Proves code signing works end to end without publishing anything: builds the
# real binaries, signs them through the same composite action the release uses,
# and verifies the result. Run it after changing signing configuration, and
# before tagging a release, so a broken credential shows up now and not on
# release day. The signed binaries are kept as a private workflow artifact for a
# day; nothing is attached to a release.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: Sign and verify (no release)
    runs-on: windows-latest
    # Same environment as the release job: the federated credential trusts
    # exactly repo:spilloid/spoolsmith:environment:release.
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build binaries
        shell: pwsh
        run: ./scripts/build-release.ps1 -Tag signcheck -Stage build

      - name: Sign and verify binaries
        uses: ./.github/actions/sign-release
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}
          expected-subject: ${{ vars.SIGNING_EXPECTED_SUBJECT }}

      - name: Keep the signed binaries for inspection
        uses: actions/upload-artifact@v4
        with:
          name: signed-binaries
          path: dist/*.exe
          retention-days: 1
