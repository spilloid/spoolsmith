name: Sign and verify release binaries
description: >
  Signs dist/spoolsmith.exe and dist/spoolsmith-gui.exe with Azure Artifact
  Signing, then fails unless both carry a valid, timestamped signature from the
  expected certificate profile. Shared by the release workflow and the signing
  check so a dry run exercises exactly what a release does.

inputs:
  client-id:
    description: Client ID of the app registration trusted by the federated credential.
    required: true
  tenant-id:
    description: Azure tenant ID.
    required: true
  subscription-id:
    description: Azure subscription ID.
    required: true
  endpoint:
    description: Regional Artifact Signing endpoint; must match the account's region.
    required: true
  account:
    description: Artifact Signing account name.
    required: true
  profile:
    description: Certificate profile name.
    required: true
  expected-subject:
    description: Substring the signer subject must contain. Empty skips the subject check.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Needs `id-token: write` on the calling job for the OIDC exchange.
    - name: Azure login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: Sign binaries
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.endpoint }}
        signing-account-name: ${{ inputs.account }}
        certificate-profile-name: ${{ inputs.profile }}
        files-folder: ${{ github.workspace }}\dist
        files-folder-filter: exe
        file-digest: SHA256
        # Signing certificates are valid for three days; without this
        # countersignature the release stops verifying almost immediately.
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        # Go straight to the federated token azure/login put in the environment
        # instead of walking the other DefaultAzureCredential sources first.
        exclude-environment-credential: false
        exclude-workload-identity-credential: false
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: true
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    # Fails the job if a binary came back unsigned or without a timestamp,
    # rather than discovering it once users cannot launch the download.
    - name: Verify signatures
      shell: pwsh
      env:
        EXPECTED_SUBJECT: ${{ inputs.expected-subject }}
      run: ./scripts/verify-signature.ps1 -Files dist/spoolsmith.exe, dist/spoolsmith-gui.exe -ExpectedSubject $env:EXPECTED_SUBJECT
