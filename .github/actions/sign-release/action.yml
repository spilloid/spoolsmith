name: Sign and verify release files
description: >
  Signs release files with Azure Artifact Signing -- by default
  dist/spoolsmith.exe and dist/spoolsmith-gui.exe, or the MSI when the inputs
  say so -- then fails unless every listed file carries a valid, timestamped
  signature from the expected certificate profile. Shared by the release
  workflow, the MSI workflow and the signing check, so every signed file goes
  through one signing path and one verification rule.

inputs:
  client-id:
    description: Client ID of the app registration trusted by the federated credential.
    required: true
  tenant-id:
    description: Azure tenant ID.
    required: true
  subscription-id:
    description: Azure subscription ID.
    required: true
  endpoint:
    description: Regional Artifact Signing endpoint; must match the account's region.
    required: true
  account:
    description: Artifact Signing account name.
    required: true
  profile:
    description: Certificate profile name.
    required: true
  expected-subject:
    description: Substring the signer subject must contain. Empty skips the subject check.
    required: false
    default: ''
  folder:
    description: Folder whose files are signed, relative to the workspace.
    required: false
    default: dist
  filter:
    description: File extension(s) to sign in that folder, e.g. exe or msi.
    required: false
    default: exe
  verify:
    description: Files that must verify afterwards, comma-separated. Signing succeeds only if all of them do.
    required: false
    default: dist/spoolsmith.exe, dist/spoolsmith-gui.exe

runs:
  using: composite
  steps:
    # Needs `id-token: write` on the calling job for the OIDC exchange.
    - name: Azure login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: Sign files
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.endpoint }}
        signing-account-name: ${{ inputs.account }}
        certificate-profile-name: ${{ inputs.profile }}
        files-folder: ${{ github.workspace }}\${{ inputs.folder }}
        files-folder-filter: ${{ inputs.filter }}
        file-digest: SHA256
        # Signing certificates are valid for three days; without this
        # countersignature the release stops verifying almost immediately.
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256
        # azure/login leaves an Azure CLI session authenticated through the OIDC
        # federated credential; it does not export AZURE_* variables or a token
        # file. So the Azure CLI credential is the only one that can succeed here,
        # and the environment and workload-identity credentials are excluded so a
        # failure names the real problem instead of listing sources that were
        # never configured.
        exclude-environment-credential: true
        exclude-workload-identity-credential: true
        exclude-managed-identity-credential: true
        exclude-shared-token-cache-credential: true
        exclude-visual-studio-credential: true
        exclude-visual-studio-code-credential: true
        exclude-azure-cli-credential: false
        exclude-azure-powershell-credential: true
        exclude-azure-developer-cli-credential: true
        exclude-interactive-browser-credential: true

    # Fails the job if a file came back unsigned or without a timestamp,
    # rather than discovering it once users cannot launch the download.
    - name: Verify signatures
      shell: pwsh
      env:
        EXPECTED_SUBJECT: ${{ inputs.expected-subject }}
        VERIFY_FILES: ${{ inputs.verify }}
      run: |
        $files = @($env:VERIFY_FILES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        if (-not $files) { throw 'No files to verify' }
        ./scripts/verify-signature.ps1 -Files $files -ExpectedSubject $env:EXPECTED_SUBJECT
